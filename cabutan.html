<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cabutan Bertuah · Sistem Anugerah</title>
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/confetti.browser.min.js"></script>
<script src="https://unpkg.com/@zxing/library@0.20.0/umd/index.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0a0e1a;
    --bg-card: #131a2e;
    --bg-input: #0d1424;
    --border: #1f2b47;
    --border-focus: #fbbf24;
    --text: #e2e8f0;
    --text-dim: #94a3b8;
    --text-muted: #64748b;
    --accent: #fbbf24;
    --accent-hover: #f59e0b;
    --blue: #38bdf8;
    --purple: #a78bfa;
    --green: #34d399;
    --red: #ef4444;
    --orange: #fb923c;
    --yellow: #fbbf24;
  }

  html, body {
    min-height: 100%;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    overflow-x: hidden;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(circle at 15% 10%, rgba(251, 191, 36, 0.12) 0%, transparent 45%),
      radial-gradient(circle at 85% 90%, rgba(167, 139, 250, 0.1) 0%, transparent 45%);
    pointer-events: none;
    z-index: 0;
  }

  .grid-overlay {
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(251, 191, 36, 0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(251, 191, 36, 0.04) 1px, transparent 1px);
    background-size: 50px 50px;
    pointer-events: none;
    z-index: 0;
    mask-image: radial-gradient(ellipse at center, black 30%, transparent 80%);
    -webkit-mask-image: radial-gradient(ellipse at center, black 30%, transparent 80%);
  }

  /* TOPBAR */
  .topbar {
    position: relative;
    z-index: 2;
    padding: 20px 32px;
    border-bottom: 1px solid var(--border);
    background: rgba(10, 14, 26, 0.7);
    backdrop-filter: blur(12px);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
  }

  .back-btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 9px 16px;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--text-dim);
    text-decoration: none;
    font-size: 13px;
    font-weight: 600;
    transition: all 0.25s;
  }
  .back-btn:hover {
    color: var(--accent);
    border-color: var(--accent);
    background: rgba(251, 191, 36, 0.08);
    transform: translateX(-3px);
  }
  .back-btn svg { width: 14px; height: 14px; }

  .topbar-title {
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 14px;
    font-weight: 600;
    color: var(--text-dim);
  }
  .topbar-title .dot {
    width: 8px; height: 8px;
    background: var(--accent);
    border-radius: 50%;
    box-shadow: 0 0 12px var(--accent);
  }

  .status-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 6px 12px;
    border-radius: 100px;
    font-size: 11.5px;
    font-weight: 700;
    letter-spacing: 0.04em;
  }
  .status-badge.online {
    background: rgba(52, 211, 153, 0.1);
    border: 1px solid rgba(52, 211, 153, 0.3);
    color: var(--green);
  }
  .status-badge.connecting {
    background: rgba(251, 191, 36, 0.1);
    border: 1px solid rgba(251, 191, 36, 0.3);
    color: var(--accent);
  }
  .status-badge.offline {
    background: rgba(239, 68, 68, 0.1);
    border: 1px solid rgba(239, 68, 68, 0.3);
    color: var(--red);
  }
  .status-dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: currentColor;
    box-shadow: 0 0 10px currentColor;
  }
  .status-badge.online .status-dot { animation: pulse 2s infinite; }
  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.6; transform: scale(0.85); }
  }

  /* CONTAINER */
  .container {
    position: relative;
    z-index: 1;
    max-width: 1400px;
    margin: 0 auto;
    padding: 32px;
  }

  @media (max-width: 960px) {
    .container { padding: 20px 16px; }
    .topbar { padding: 16px; }
  }

  /* LAYOUT */
  .cabutan-layout {
    display: grid;
    grid-template-columns: 1fr 380px;
    gap: 24px;
    align-items: start;
  }

  @media (max-width: 1100px) {
    .cabutan-layout { grid-template-columns: 1fr; }
  }

  /* WHEEL SECTION */
  .wheel-section {
    background: linear-gradient(145deg, var(--bg-card), rgba(19, 26, 46, 0.6));
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 24px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
  }

  .wheel-title {
    font-size: 24px;
    font-weight: 800;
    letter-spacing: -0.02em;
    background: linear-gradient(135deg, #ffffff 0%, #fbbf24 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    text-align: center;
  }

  .wheel-subtitle {
    font-size: 13px;
    color: var(--text-dim);
    text-align: center;
    margin-top: -14px;
  }

  .wheel-wrapper {
    position: relative;
    width: 100%;
    max-width: 600px;
    aspect-ratio: 1;
    margin: 0 auto;
  }

  #wheelCanvas {
    width: 100%;
    height: 100%;
    filter: drop-shadow(0 20px 40px rgba(251, 191, 36, 0.3));
    transition: filter 0.3s;
  }

  #wheelCanvas.spinning {
    filter: drop-shadow(0 20px 40px rgba(251, 191, 36, 0.6));
  }

  .pointer {
    position: absolute;
    top: -12px;
    left: 50%;
    transform: translateX(-50%);
    width: 0;
    height: 0;
    border-left: 22px solid transparent;
    border-right: 22px solid transparent;
    border-top: 44px solid var(--accent);
    filter: drop-shadow(0 4px 12px rgba(251, 191, 36, 0.6));
    z-index: 10;
  }
  .pointer::after {
    content: '';
    position: absolute;
    top: -48px;
    left: -12px;
    width: 24px;
    height: 24px;
    background: var(--accent);
    border-radius: 50%;
    box-shadow: 0 0 20px rgba(251, 191, 36, 0.8);
  }

  .spin-btn {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 110px;
    height: 110px;
    border-radius: 50%;
    background: linear-gradient(145deg, #fbbf24, #f59e0b);
    border: 6px solid var(--bg-card);
    color: #0a0e1a;
    font-family: inherit;
    font-size: 15px;
    font-weight: 900;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
    box-shadow:
      0 10px 30px rgba(251, 191, 36, 0.5),
      inset 0 -6px 12px rgba(0, 0, 0, 0.2),
      inset 0 4px 8px rgba(255, 255, 255, 0.3);
    transition: all 0.25s;
    z-index: 20;
  }

  .spin-btn:hover:not(:disabled) {
    transform: translate(-50%, -50%) scale(1.08);
    box-shadow:
      0 14px 40px rgba(251, 191, 36, 0.7),
      inset 0 -6px 12px rgba(0, 0, 0, 0.2),
      inset 0 4px 8px rgba(255, 255, 255, 0.3);
  }

  .spin-btn:active:not(:disabled) {
    transform: translate(-50%, -50%) scale(1.02);
  }

  .spin-btn:disabled {
    opacity: 0.7;
    cursor: not-allowed;
    background: linear-gradient(145deg, #94a3b8, #64748b);
  }

  .spin-btn .icon {
    font-size: 26px;
    line-height: 1;
  }

  .spin-btn .label {
    font-size: 12px;
    letter-spacing: 0.08em;
  }

  /* WINNER MODAL */
  .winner-overlay {
    position: fixed;
    inset: 0;
    background: rgba(5, 8, 16, 0.92);
    backdrop-filter: blur(20px);
    z-index: 9999;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.5s;
  }

  .winner-overlay.active {
    opacity: 1;
    pointer-events: auto;
  }

  .winner-card {
    background: linear-gradient(145deg, #131a2e, #0a0e1a);
    border: 3px solid var(--accent);
    border-radius: 32px;
    padding: 48px 40px;
    max-width: 700px;
    width: 100%;
    text-align: center;
    position: relative;
    overflow: hidden;
    box-shadow:
      0 40px 100px rgba(0, 0, 0, 0.8),
      0 0 100px rgba(251, 191, 36, 0.4),
      inset 0 0 60px rgba(251, 191, 36, 0.05);
    transform: scale(0.7) rotate(-5deg);
    transition: transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  .winner-overlay.active .winner-card {
    transform: scale(1) rotate(0deg);
  }

  .winner-card::before {
    content: '';
    position: absolute;
    top: -50%;
    left: -50%;
    width: 200%;
    height: 200%;
    background: conic-gradient(
      from 0deg,
      transparent 0deg,
      rgba(251, 191, 36, 0.15) 20deg,
      transparent 40deg,
      transparent 180deg,
      rgba(251, 191, 36, 0.15) 200deg,
      transparent 220deg
    );
    animation: rotate 8s linear infinite;
    pointer-events: none;
  }

  @keyframes rotate {
    to { transform: rotate(360deg); }
  }

  .winner-content {
    position: relative;
    z-index: 1;
  }

  .winner-icon {
    font-size: 80px;
    margin-bottom: 16px;
    animation: bounce 1s ease-in-out infinite;
  }

  @keyframes bounce {
    0%, 100% { transform: translateY(0) scale(1); }
    50% { transform: translateY(-12px) scale(1.05); }
  }

  .winner-label {
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 12px;
  }

  .winner-name {
    font-size: clamp(28px, 5vw, 48px);
    font-weight: 900;
    letter-spacing: -0.02em;
    background: linear-gradient(135deg, #ffffff 0%, #fbbf24 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 12px;
    line-height: 1.15;
    text-transform: uppercase;
  }

  .winner-matrik {
    font-size: 18px;
    font-family: 'Courier New', monospace;
    color: var(--text-dim);
    font-weight: 700;
    letter-spacing: 0.1em;
    margin-bottom: 8px;
  }

  .winner-barcode {
    font-size: 13px;
    font-family: 'Courier New', monospace;
    color: var(--text-muted);
    letter-spacing: 0.05em;
    margin-bottom: 28px;
  }

  .winner-actions {
    display: flex;
    gap: 10px;
    justify-content: center;
    flex-wrap: wrap;
  }

  /* SCAN SECTION */
  .scan-section {
    background: linear-gradient(145deg, var(--bg-card), rgba(19, 26, 46, 0.6));
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 24px;
    margin-bottom: 20px;
  }

  .scan-section h3 {
    font-size: 14px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--text-dim);
    margin-bottom: 14px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .scan-section h3 .icon {
    width: 24px; height: 24px;
    border-radius: 6px;
    background: linear-gradient(135deg, rgba(251, 191, 36, 0.2), rgba(251, 146, 60, 0.2));
    border: 1px solid rgba(251, 191, 36, 0.3);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    color: var(--accent);
  }

  .input-row {
    display: flex;
    gap: 8px;
  }

  .input-row input {
    flex: 1;
    padding: 12px 14px;
    background: var(--bg-input);
    border: 1.5px solid var(--border);
    border-radius: 10px;
    color: var(--text);
    font-family: inherit;
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    transition: all 0.2s;
  }
  .input-row input::placeholder {
    color: var(--text-muted);
    font-weight: 400;
    text-transform: none;
    letter-spacing: normal;
  }
  .input-row input:focus {
    outline: none;
    border-color: var(--border-focus);
    box-shadow: 0 0 0 4px rgba(251, 191, 36, 0.12);
  }

  .btn-icon {
    padding: 0 16px;
    background: linear-gradient(135deg, rgba(251, 191, 36, 0.15), rgba(251, 146, 60, 0.15));
    border: 1.5px solid rgba(251, 191, 36, 0.4);
    border-radius: 10px;
    color: var(--accent);
    font-family: inherit;
    font-size: 12.5px;
    font-weight: 700;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 6px;
    transition: all 0.2s;
    white-space: nowrap;
  }
  .btn-icon:hover {
    background: linear-gradient(135deg, rgba(251, 191, 36, 0.25), rgba(251, 146, 60, 0.25));
    border-color: var(--accent);
  }
  .btn-icon svg { width: 16px; height: 16px; }

  .btn-add {
    width: 100%;
    margin-top: 10px;
    padding: 12px 20px;
    background: linear-gradient(135deg, var(--accent), var(--accent-hover));
    color: #0a0e1a;
    border: none;
    border-radius: 10px;
    font-family: inherit;
    font-size: 13px;
    font-weight: 800;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    transition: all 0.2s;
    box-shadow: 0 6px 20px -6px rgba(251, 191, 36, 0.5);
  }
  .btn-add:hover {
    transform: translateY(-2px);
    box-shadow: 0 12px 28px -6px rgba(251, 191, 36, 0.6);
  }
  .btn-add svg { width: 16px; height: 16px; }

  /* STATS */
  .stats-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
    gap: 10px;
    margin-bottom: 20px;
  }

  .stat-mini {
    background: var(--bg-input);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px;
    text-align: center;
  }
  .stat-mini .num {
    font-size: 22px;
    font-weight: 900;
    color: var(--accent);
    line-height: 1;
    font-family: 'Courier New', monospace;
  }
  .stat-mini .label {
    font-size: 10px;
    color: var(--text-muted);
    margin-top: 6px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    font-weight: 700;
  }

  /* HISTORY */
  .history-section {
    background: linear-gradient(145deg, var(--bg-card), rgba(19, 26, 46, 0.6));
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 20px;
    max-height: 500px;
    display: flex;
    flex-direction: column;
  }

  .history-section h3 {
    font-size: 13px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--text-dim);
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }

  .btn-clear-winners {
    padding: 5px 10px;
    background: rgba(239, 68, 68, 0.1);
    border: 1px solid rgba(239, 68, 68, 0.3);
    border-radius: 6px;
    color: var(--red);
    font-family: inherit;
    font-size: 10.5px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s;
    text-transform: uppercase;
  }
  .btn-clear-winners:hover {
    background: rgba(239, 68, 68, 0.2);
    border-color: var(--red);
  }

  .history-list {
    overflow-y: auto;
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .history-list::-webkit-scrollbar { width: 6px; }
  .history-list::-webkit-scrollbar-thumb {
    background: var(--border);
    border-radius: 3px;
  }

  .history-item {
    padding: 12px;
    background: var(--bg-input);
    border: 1px solid var(--border);
    border-radius: 10px;
    display: flex;
    align-items: center;
    gap: 10px;
    animation: historyIn 0.4s ease-out;
  }

  @keyframes historyIn {
    from { opacity: 0; transform: translateX(20px); }
    to { opacity: 1; transform: translateX(0); }
  }

  .history-num {
    width: 32px; height: 32px;
    border-radius: 8px;
    background: linear-gradient(135deg, rgba(251, 191, 36, 0.25), rgba(251, 146, 60, 0.25));
    border: 1px solid rgba(251, 191, 36, 0.3);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    font-weight: 900;
    color: var(--accent);
    font-family: 'Courier New', monospace;
    flex-shrink: 0;
  }

  .history-info { flex: 1; min-width: 0; }
  .history-info .name {
    font-size: 13px;
    font-weight: 800;
    color: #f1f5f9;
    text-transform: uppercase;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .history-info .meta {
    font-size: 10.5px;
    color: var(--text-muted);
    font-family: 'Courier New', monospace;
    margin-top: 2px;
  }

  .history-empty {
    text-align: center;
    padding: 40px 20px;
    color: var(--text-muted);
    font-size: 12px;
  }

  /* BUTTONS */
  .btn-secondary, .btn-primary-modal {
    padding: 12px 24px;
    border-radius: 10px;
    font-family: inherit;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    border: none;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }

  .btn-secondary {
    background: var(--bg-input);
    color: var(--text-dim);
    border: 1px solid var(--border);
  }
  .btn-secondary:hover { background: var(--border); color: var(--text); }

  .btn-primary-modal {
    background: linear-gradient(135deg, var(--accent), var(--accent-hover));
    color: #0a0e1a;
    box-shadow: 0 6px 20px -6px rgba(251, 191, 36, 0.5);
  }
  .btn-primary-modal:hover {
    transform: translateY(-1px);
    box-shadow: 0 10px 24px -6px rgba(251, 191, 36, 0.6);
  }

  /* SCAN MODAL */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(5, 8, 16, 0.85);
    backdrop-filter: blur(8px);
    z-index: 9998;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s;
  }
  .modal-overlay.active { opacity: 1; pointer-events: auto; }

  .modal {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 20px;
    width: 100%;
    max-width: 560px;
    overflow: hidden;
    transform: scale(0.9);
    transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
    box-shadow: 0 24px 64px rgba(0, 0, 0, 0.6);
  }
  .modal-overlay.active .modal { transform: scale(1); }

  .modal-header {
    padding: 20px 24px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .modal-header h3 {
    font-size: 16px;
    font-weight: 700;
    color: var(--text);
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .modal-close {
    width: 34px; height: 34px;
    border-radius: 8px;
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text-muted);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s;
  }
  .modal-close:hover {
    background: rgba(239, 68, 68, 0.12);
    border-color: var(--red);
    color: var(--red);
  }
  .modal-close svg { width: 16px; height: 16px; }

  .modal-body { padding: 24px; }

  .video-wrapper {
    position: relative;
    width: 100%;
    aspect-ratio: 4/3;
    background: #000;
    border-radius: 12px;
    overflow: hidden;
    border: 1px solid var(--border);
  }

  #scanVideo {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .scan-overlay {
    position: absolute;
    inset: 0;
    pointer-events: none;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .scan-frame {
    width: 70%;
    aspect-ratio: 1;
    border: 3px solid var(--accent);
    border-radius: 14px;
    position: relative;
    box-shadow: 0 0 24px rgba(251, 191, 36, 0.5), inset 0 0 24px rgba(251, 191, 36, 0.2);
  }

  .scan-line {
    position: absolute;
    left: 8%; right: 8%;
    height: 2px;
    background: linear-gradient(90deg, transparent, var(--accent), transparent);
    box-shadow: 0 0 12px var(--accent);
    animation: scanLine 2s ease-in-out infinite;
  }

  @keyframes scanLine {
    0%, 100% { top: 20%; }

  .toast .icon { font-size: 18px; }

</style>

<div class="toast-container" id="toastContainer"></div>

<!-- ============================================================
     FIREBASE + LOGIC
     ============================================================ -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAnalytics } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-analytics.js";
import {
  getFirestore, collection, onSnapshot, query, orderBy
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBJ5s5p-htfW9nBmmHvfsUmgh7Q9j6eEIw",
  authDomain: "akjjtmk.firebaseapp.com",
  projectId: "akjjtmk",
  storageBucket: "akjjtmk.firebasestorage.app",
  messagingSenderId: "28020787148",
  appId: "1:28020787148:web:47c3c3c62e11f71c59ff69"
};

const app = initializeApp(firebaseConfig);
const analytics = getAnalytics(app);
const db = getFirestore(app);

/* ============================================================
   STATE
   ============================================================ */
let allRecipients = [];
let filteredRecipients = [];  // peserta yang belum menang
let winners = [];              // array of recipient IDs yang dah menang
let isSpinning = false;
let wheelRotation = 0;

/* ============================================================
   HELPERS
   ============================================================ */
function toast(msg, type = 'info', duration = 3500) {
  const icons = { success: '✅', error: '❌', warn: '⚠️', info: 'ℹ️' };
  const el = document.createElement('div');
  el.className = 'toast ' + type;
  el.innerHTML = `<span class="icon">${icons[type]}</span><span>${msg}</span>`;
  document.getElementById('toastContainer').appendChild(el);
  setTimeout(() => {
    el.style.transition = 'all 0.3s';
    el.style.opacity = '0';
    el.style.transform = 'translateX(400px)';
    setTimeout(() => el.remove(), 300);
  }, duration);
}

function setStatus(state, text) {
  const b = document.getElementById('statusBadge');
  b.className = 'status-badge ' + state;
  document.getElementById('statusText').textContent = text;
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* ============================================================
   FIREBASE LISTENER
   ============================================================ */
const recipientsQ = query(collection(db, 'recipients'), orderBy('barcode', 'asc'));

onSnapshot(recipientsQ, (snap) => {
  allRecipients = snap.docs.map(d => ({ id: d.id, ...d.data() }));
  setStatus('online', 'Online');
  applyFilterAndRender();
}, (err) => {
  console.error('recipients:', err);
  setStatus('offline', 'Offline');
});

/* ============================================================
   APPLY FILTER — semua peserta, buang yang dah menang
   ============================================================ */
function applyFilterAndRender() {
  // Semua peserta, buang yang dah menang
  filteredRecipients = allRecipients.filter(r => !winners.includes(r.id));

  // Update stats
  document.getElementById('statTotal').textContent = allRecipients.length;
  document.getElementById('statWinners').textContent = winners.length;
  document.getElementById('statRemaining').textContent = filteredRecipients.length;

  // Update subtitle
  const subtitle = document.getElementById('wheelSubtitle');
  if (allRecipients.length === 0) {
    subtitle.textContent = 'Tiada peserta lagi. Daftar dulu di page Daftar Penerima.';
  } else if (filteredRecipients.length === 0) {
    subtitle.textContent = '🎉 Semua peserta sudah menang! Klik Reset untuk mula semula.';
  } else if (filteredRecipients.length === 1) {
    subtitle.textContent = 'Hanya 1 peserta tinggal — tekan SPIN!';
  } else {
    subtitle.textContent = `${filteredRecipients.length} peserta dalam cabutan`;
  }

  // Disable spin kalau tak cukup peserta
  document.getElementById('btnSpin').disabled = filteredRecipients.length < 1 || isSpinning;

  // Render wheel
  renderWheel();
}

/* ============================================================
   RENDER WHEEL (Canvas)
   ============================================================ */
const canvas = document.getElementById('wheelCanvas');
const ctx = canvas.getContext('2d');

const SEGMENT_COLORS = [
  '#fbbf24', '#38bdf8', '#a78bfa', '#f472b6',
  '#34d399', '#fb923c', '#60a5fa', '#c084fc',
  '#f87171', '#4ade80', '#eab308', '#06b6d4',
  '#ec4899', '#8b5cf6', '#10b981', '#f59e0b'
];

function renderWheel() {
  const w = canvas.width;
  const h = canvas.height;
  const cx = w / 2;
  const cy = h / 2;
  const radius = Math.min(w, h) / 2 - 20;

  ctx.clearRect(0, 0, w, h);

  const segments = filteredRecipients;

  if (segments.length === 0) {
    ctx.beginPath();
    ctx.arc(cx, cy, radius, 0, 2 * Math.PI);
    ctx.fillStyle = '#1f2b47';
    ctx.fill();
    ctx.strokeStyle = '#334155';
    ctx.lineWidth = 4;
    ctx.stroke();

    ctx.fillStyle = '#64748b';
    ctx.font = 'bold 32px Segoe UI, sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('Tiada Peserta', cx, cy);
    return;
  }

  const arc = (2 * Math.PI) / segments.length;

  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate((wheelRotation * Math.PI) / 180);
  ctx.translate(-cx, -cy);

  segments.forEach((r, i) => {
    const startAngle = i * arc;
    const endAngle = (i + 1) * arc;

    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.arc(cx, cy, radius, startAngle, endAngle);
    ctx.closePath();
    ctx.fillStyle = SEGMENT_COLORS[i % SEGMENT_COLORS.length];
    ctx.fill();

    ctx.strokeStyle = '#0a0e1a';
    ctx.lineWidth = 3;
    ctx.stroke();

    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(startAngle + arc / 2);
    ctx.textAlign = 'right';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = '#0a0e1a';
    ctx.font = `bold ${Math.min(24, Math.max(12, 800 / segments.length))}px Segoe UI, sans-serif`;

    let name = String(r.nama || '-').toUpperCase();
    if (name.length > 18) name = name.substring(0, 17) + '…';

    ctx.fillText(name, radius - 20, 0);

    ctx.font = `bold ${Math.min(16, Math.max(10, 600 / segments.length))}px 'Courier New', monospace`;
    ctx.fillStyle = 'rgba(10, 14, 26, 0.7)';
    ctx.fillText('#' + (r.barcode || '----'), radius - 20, 24);

    ctx.restore();
  });

  ctx.restore();

  // Outer ring
  ctx.beginPath();
  ctx.arc(cx, cy, radius, 0, 2 * Math.PI);
  ctx.strokeStyle = '#fbbf24';
  ctx.lineWidth = 8;
  ctx.stroke();

  // Inner circle
  ctx.beginPath();
  ctx.arc(cx, cy, 60, 0, 2 * Math.PI);
  ctx.fillStyle = '#0a0e1a';
  ctx.fill();
  ctx.strokeStyle = '#fbbf24';
  ctx.lineWidth = 4;
  ctx.stroke();
}

/* ============================================================
   SPIN LOGIC
   ============================================================ */
document.getElementById('btnSpin').addEventListener('click', spinWheel);

function spinWheel() {
  if (isSpinning) return;

  const segments = filteredRecipients;
  if (segments.length < 1) {
    return toast('Tiada peserta untuk cabutan', 'warn');
  }

  isSpinning = true;
  const btn = document.getElementById('btnSpin');
  btn.disabled = true;
  canvas.classList.add('spinning');

  // Pilih pemenang rawak
  const winnerIndex = Math.floor(Math.random() * segments.length);
  const winner = segments[winnerIndex];

  // Kira rotation untuk pemenang di atas
  const arc = 360 / segments.length;
  const segmentCenter = winnerIndex * arc + arc / 2;
  const targetAngle = 270 - segmentCenter;
  const spins = 5 + Math.floor(Math.random() * 3);
  const totalRotation = spins * 360 + targetAngle;

  const startRotation = wheelRotation % 360;
  const duration = 5000;
  const startTime = performance.now();

  function animate(now) {
    const elapsed = now - startTime;
    const progress = Math.min(elapsed / duration, 1);
    const eased = 1 - Math.pow(1 - progress, 4);
    wheelRotation = startRotation + (totalRotation * eased);

    renderWheel();

    if (progress < 1) {
      requestAnimationFrame(animate);
    } else {
      onSpinComplete(winner);
    }
  }

  requestAnimationFrame(animate);
}

function onSpinComplete(winner) {
  isSpinning = false;
  canvas.classList.remove('spinning');

  if (!winners.includes(winner.id)) {
    winners.push(winner.id);
  }

  applyFilterAndRender();
  updateHistoryList();
  showWinnerModal(winner);
  triggerConfetti();
  playBeepSequence();
}

/* ============================================================
   WINNER MODAL
   ============================================================ */
function showWinnerModal(winner) {
  document.getElementById('winnerName').textContent = winner.nama || '-';
  document.getElementById('winnerMatrik').textContent = winner.matrik || '-';
  document.getElementById('winnerBarcode').textContent = 'Barcode: ' + (winner.barcode || '----');
  document.getElementById('winnerOverlay').classList.add('active');
}

document.getElementById('btnWinnerDone').addEventListener('click', () => {
  document.getElementById('winnerOverlay').classList.remove('active');
});

document.getElementById('btnWinnerNext').addEventListener('click', () => {
  document.getElementById('winnerOverlay').classList.remove('active');
  window.scrollTo({ top: 0, behavior: 'smooth' });
  setTimeout(() => {
    if (filteredRecipients.length >= 1) {
      spinWheel();
    } else {
      toast('Tak cukup peserta lagi untuk cabutan seterusnya', 'info');
    }
  }, 600);
});

/* ============================================================
   CONFETTI + SOUND
   ============================================================ */
function triggerConfetti() {
  const duration = 4000;
  const animationEnd = Date.now() + duration;
  const defaults = { startVelocity: 30, spread: 360, ticks: 60, zIndex: 10000 };

  function randomInRange(min, max) {
    return Math.random() * (max - min) + min;
  }

  const interval = setInterval(function() {
    const timeLeft = animationEnd - Date.now();

    if (timeLeft <= 0) {
      return clearInterval(interval);
    }

    const particleCount = 50 * (timeLeft / duration);

    confetti(Object.assign({}, defaults, {
      particleCount,
      origin: { x: randomInRange(0.1, 0.3), y: Math.random() - 0.2 }
    }));
    confetti(Object.assign({}, defaults, {
      particleCount,
      origin: { x: randomInRange(0.7, 0.9), y: Math.random() - 0.2 }
    }));
  }, 250);
}

function playBeepSequence() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const notes = [523.25, 659.25, 783.99, 1046.5];
    notes.forEach((freq, i) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.frequency.value = freq;
      gain.gain.value = 0.1;
      osc.start(ctx.currentTime + i * 0.12);
      osc.stop(ctx.currentTime + i * 0.12 + 0.15);
    });
  } catch (e) {}
}

/* ============================================================
   MARK WINNER BY SCAN
   ============================================================ */
document.getElementById('inpBarcode').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') {
    e.preventDefault();
    markWinnerByCode();
  }
});

document.getElementById('btnMark').addEventListener('click', markWinnerByCode);

function markWinnerByCode() {
  const inp = document.getElementById('inpBarcode');
  const code = inp.value.trim().toUpperCase();

  if (!code) return toast('Taip nombor QR dulu', 'warn');

  const found = allRecipients.find(r =>
    String(r.barcode || '').toUpperCase() === code
  );

  if (!found) {
    return toast('QR ' + code + ' tidak dijumpai', 'error');
  }

  if (winners.includes(found.id)) {
    return toast(found.nama + ' sudah jadi pemenang', 'warn');
  }

  winners.push(found.id);
  inp.value = '';

  applyFilterAndRender();
  updateHistoryList();
  showWinnerModal(found);

  confetti({
    particleCount: 100,
    spread: 100,
    origin: { y: 0.6 },
    zIndex: 10000
  });

  playBeepSequence();
  toast('✅ ' + found.nama + ' ditandakan sebagai pemenang', 'success');
}

/* ============================================================
   HISTORY LIST
   ============================================================ */
function updateHistoryList() {
  const list = document.getElementById('historyList');

  if (winners.length === 0) {
    list.innerHTML = '<div class="history-empty">Belum ada pemenang</div>';
    return;
  }

  // Sort: pemenang terkini di atas
  const winnerRecipients = winners
    .map(id => allRecipients.find(r => r.id === id))
    .filter(Boolean)
    .reverse();

  list.innerHTML = winnerRecipients.map((r, i) => {
    const num = winners.length - i;
    return `
      <div class="history-item">
        <div class="history-num">${num}</div>
        <div class="history-info">
          <div class="name">${escapeHtml(r.nama || '-')}</div>
          <div class="meta">${escapeHtml(r.matrik || '-')} · #${escapeHtml(r.barcode || '----')}</div>
        </div>
      </div>
    `;
  }).join('');
}

/* ============================================================
   CLEAR WINNERS
   ============================================================ */
document.getElementById('btnClearWinners').addEventListener('click', () => {
  if (winners.length === 0) return;
  if (!confirm('Reset semua pemenang? Semua akan masuk semula dalam cabutan.')) return;

  winners = [];
  applyFilterAndRender();
  updateHistoryList();
  toast('Pemenang direset — semua peserta boleh menang semula', 'success');
});

/* ============================================================
   SCAN QR MODAL
   ============================================================ */
let codeReader = null;
let scanActive = false;
let lastScannedCode = '';
let lastScannedTime = 0;

const scanModal = document.getElementById('scanModal');
const scanStatus = document.getElementById('scanStatus');
const scanStatusText = document.getElementById('scanStatusText');

document.getElementById('btnOpenScan').addEventListener('click', openScanModal);
document.getElementById('btnCloseScan').addEventListener('click', closeScanModal);
scanModal.addEventListener('click', (e) => { if (e.target === scanModal) closeScanModal(); });

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    if (scanModal.classList.contains('active')) closeScanModal();
    if (document.getElementById('winnerOverlay').classList.contains('active')) {
      document.getElementById('winnerOverlay').classList.remove('active');
    }
  }
});

async function openScanModal() {
  scanModal.classList.add('active');
  scanStatus.className = 'scan-status';
  scanStatusText.textContent = 'Menghidupkan kamera...';

  try {
    codeReader = new ZXing.BrowserMultiFormatReader();

    const hints = new Map();
    hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS, [ZXing.BarcodeFormat.QR_CODE]);
    hints.set(ZXing.DecodeHintType.TRY_HARDER, true);

    codeReader.hints = hints;
    scanActive = true;

    await codeReader.decodeFromVideoDevice(null, 'scanVideo', (result, err) => {
      if (result && scanActive) {
        handleScanResult(result.getText().trim().toUpperCase());
      }
    });

    scanStatusText.textContent = '✅ Kamera aktif';
  } catch (e) {
    console.error(e);
    scanStatus.className = 'scan-status error';
    scanStatusText.textContent = '❌ ' + e.message;
  }
}

function closeScanModal() {
  scanActive = false;
  if (codeReader) { try { codeReader.reset(); } catch(e) {} codeReader = null; }
  scanModal.classList.remove('active');
}

function handleScanResult(code) {
  const now = Date.now();
  if (code === lastScannedCode && now - lastScannedTime < 1500) return;
  lastScannedCode = code;
  lastScannedTime = now;

  scanStatus.className = 'scan-status success';
  scanStatusText.textContent = `✅ QR dikesan: ${code}`;

  try { playBeepSequence(); } catch(e) {}

  setTimeout(() => {
    closeScanModal();
    document.getElementById('inpBarcode').value = code;
    markWinnerByCode();
  }, 600);
}

/* ============================================================
   INIT
   ============================================================ */
setStatus('connecting', 'Menyambung...');
renderWheel();
updateHistoryList();

console.log('%c🎰 Cabutan Bertuah · Spin the Wheel', 'color: #fbbf24; font-size: 14px; font-weight: bold;');
</script>
